<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Cửa Hàng Công Nghệ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">Tech<span>Store</span></div>
        <nav class="nav-links">
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Liên hệ</a>
        </nav>
        <button class="btn-cart">🛒 Giỏ hàng (<span id="cart-count">0</span>)</button>
    </header>

    <!-- Banner Nổi Bật -->
    <section class="hero">
        <div class="hero-text">
            <h1>Tai Nghe Bluetooth Pro Max</h1>
            <p>Trải nghiệm âm thanh vòm sống động, chống ồn chủ động đỉnh cao với thời lượng pin 40 giờ.</p>
            <button class="btn-primary">Mua ngay - 2.490.000đ</button>
        </div>
        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Tai nghe">
        </div>
    </section>

    <!-- Danh Sách Sản Phẩm -->
    <section class="products-section">
        <h2>Sản Phẩm Nổi Bật</h2>
        <div class="product-grid">
            
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Đồng hồ">
                <h3>Đồng Hồ Smartwatch S8</h3>
                <p class="price">1.890.000đ</p>
                <button class="btn-add-cart" onclick="addToCart()">Thêm vào giỏ</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1585060544812-6b45742d762f?w=400" alt="Điện thoại">
                <h3>Smartphone Flagship X</h3>
                <p class="price">15.990.000đ</p>
                <button class="btn-add-cart" onclick="addToCart()">Thêm vào giỏ</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400" alt="Tai nghe">
                <h3>Tai Nghe Over-Ear Pro</h3>
                <p class="price">3.200.000đ</p>
                <button class="btn-add-cart" onclick="addToCart()">Thêm vào giỏ</button>
            </div>

        </div>
    </section>

    <!-- JavaScript Xử Lý Tương Tác -->
    <script>
        let count = 0;
        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
        }
    </script>
</body>
</html>
